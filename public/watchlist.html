<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>热门持续关注股 | OpenClaw</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/app.css" />
  <link rel="stylesheet" href="/assets/css/focus-pages.css" />
</head>
<body>
  <div class="bg-grid"></div>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>

  <main class="focus-shell">
    <header class="focus-top">
      <div>
        <h1 class="focus-title">热门持续关注股</h1>
        <p class="focus-sub">你的主观关注 + OpenClaw 推荐合并池，持续更新支撑/压力与操作建议</p>
      </div>
      <div class="focus-actions">
        <button id="openDashboardBtn" class="btn ghost" type="button">总面板</button>
        <button id="openPositionsBtn" class="btn ghost" type="button">持仓雷达</button>
        <button id="openSectorsBtn" class="btn ghost" type="button">板块雷达</button>
        <button id="sortByScoreBtn" class="btn ghost" type="button">综合排序: 开</button>
        <button id="analyzeAllBtn" class="btn">全池分析</button>
        <button id="refreshBtn" class="btn ghost">刷新</button>
        <button id="logoutBtn" class="btn danger">退出</button>
      </div>
    </header>

    <section id="watchKpi" class="focus-grid"></section>

    <section class="focus-layout">
      <section class="focus-panel">
        <div class="focus-actions" style="justify-content: space-between; margin-bottom: 8px;">
          <h3 style="margin:0;">关注池总览</h3>
          <span id="watchStamp" class="chip">-</span>
        </div>
        <div class="notice">自动策略：每 15 秒刷新行情与评分，每 2 分钟对 active 股票执行分析，输出压力/支撑/建议。</div>
        <div style="margin-top:8px; overflow:auto;">
          <table class="focus-table" id="watchTable"></table>
        </div>
      </section>

      <section class="focus-panel">
        <h3 style="margin-top:0;">新增/编辑关注股</h3>
        <form id="watchForm" class="focus-form two">
          <input type="hidden" name="id" />
          <label>代码<input name="symbol" required placeholder="600519" /></label>
          <label>名称<input name="name" placeholder="贵州茅台" /></label>
          <label>市场
            <select name="market">
              <option value="A_STOCK_MAIN">A 股主板</option>
              <option value="US">美股</option>
            </select>
          </label>
          <label>状态
            <select name="status">
              <option value="active">持续跟踪</option>
              <option value="paused">暂停</option>
              <option value="archived">归档</option>
            </select>
          </label>
          <label>优先级<input name="priority" type="number" value="50" /></label>
          <label class="full">跟踪逻辑<textarea name="thesis" rows="3" placeholder="为什么值得持续关注"></textarea></label>
          <div class="full focus-actions">
            <button class="btn primary" type="submit">保存</button>
            <button class="btn ghost" type="button" id="resetFormBtn">重置</button>
          </div>
        </form>

        <h3 style="margin-top:16px;">分析历史（选中股票）</h3>
        <div id="insightList" class="focus-list"></div>
      </section>
    </section>
  </main>

  <template id="toastTpl"><div class="toast"></div></template>
  <script src="/assets/js/watchlist-page.js?v=20260416b" type="module"></script>
</body>
</html>
